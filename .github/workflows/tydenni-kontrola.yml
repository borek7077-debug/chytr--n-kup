name: Tydenni kontrola XML feedu (bez publikovani)
on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stahnout a zkontrolovat 9 XML feedu
        run: python import_feeds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-report
          path: feed_report.csv
          retention-days: 14
